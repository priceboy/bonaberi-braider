{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Luxury Salon Website{% endblock %}</title>
    <meta name="description" content="{% block description %}Luxury salon website{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'website/css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    {% if not site_config or site_config.booking_url %}
    <a
        class="floating-booking"
        href="{% if site_config and site_config.booking_url %}{{ site_config.booking_url }}{% else %}https://wa.me/237672748984{% endif %}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Book an appointment on WhatsApp"
    >
        <svg class="floating-booking__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.52 3.48A11.8 11.8 0 0 0 12.13 0C5.62 0 .32 5.3.32 11.81c0 2.08.54 4.11 1.57 5.9L.22 24l6.44-1.69a11.8 11.8 0 0 0 5.46 1.35h.01c6.51 0 11.81-5.3 11.81-11.81 0-3.16-1.23-6.13-3.42-8.37ZM12.13 21.65h-.01a9.8 9.8 0 0 1-4.99-1.36l-.36-.21-3.82 1 1.02-3.72-.24-.38a9.78 9.78 0 0 1-1.5-5.17c0-5.4 4.4-9.8 9.8-9.8a9.74 9.74 0 0 1 6.93 2.87 9.74 9.74 0 0 1 2.87 6.94c0 5.4-4.4 9.8-9.8 9.8Zm5.38-7.34c-.29-.15-1.7-.84-1.97-.94-.26-.1-.45-.15-.64.15-.19.29-.74.94-.9 1.13-.16.19-.33.22-.62.07-.29-.15-1.22-.45-2.32-1.43-.86-.77-1.44-1.72-1.61-2.01-.17-.29-.02-.45.13-.59.13-.13.29-.33.43-.49.15-.16.19-.28.29-.47.1-.19.05-.36-.02-.5-.07-.15-.64-1.55-.88-2.12-.23-.56-.47-.48-.64-.49h-.55c-.19 0-.5.07-.76.36-.26.29-1 1-1 2.42s1.03 2.8 1.17 2.99c.15.19 2.03 3.1 4.92 4.35.69.3 1.22.48 1.64.61.69.22 1.31.19 1.8.12.55-.08 1.7-.69 1.94-1.36.24-.67.24-1.24.17-1.36-.07-.12-.26-.19-.55-.33Z"/>
        </svg>
        <span>Book on WhatsApp</span>
    </a>
    {% endif %}

    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
        <div class="bottom-nav__inner">
            <a href="{% url 'website:home' %}" class="bottom-nav__item {% if request.resolver_match.url_name == 'home' %}is-active{% endif %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>
                <span>Home</span>
            </a>
            <a href="{% url 'website:our_work' %}" class="bottom-nav__item {% if request.resolver_match.url_name == 'our_work' %}is-active{% endif %}" {% if request.resolver_match.url_name == 'our_work' %}aria-current="page"{% endif %}>
                <span>Our Work</span>
            </a>
            <a href="{% url 'website:find_us' %}" class="bottom-nav__item {% if request.resolver_match.url_name == 'find_us' %}is-active{% endif %}" {% if request.resolver_match.url_name == 'find_us' %}aria-current="page"{% endif %}>
                <span>How to Find Us</span>
            </a>
        </div>
    </nav>

    {% block extra_js %}{% endblock %}
</body>
</html>
